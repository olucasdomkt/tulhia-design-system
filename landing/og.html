<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;700;800&family=Spline+Sans+Mono:wght@500;600&display=block">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F5F6F2; color: #172238; font-family: "Schibsted Grotesk", sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
.og { width: 1200px; height: 630px; display: grid; grid-template-columns: 640px 560px; }
.texto { padding: 48px 48px 40px 56px; display: flex; flex-direction: column; justify-content: space-between; border-right: 2px solid #172238; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 40px; height: 40px; }
.logo span { font: 800 34px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -.045em; }
h1 { margin: 0 0 24px; font: 800 56px/1.03 "Schibsted Grotesk", sans-serif; letter-spacing: -.035em; }
.livro { border-top: 2px solid #172238; }
.linha { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #D9DDE3; }
.linha span { font-size: 20px; color: #565E6B; }
.linha b { font: 600 24px/1 "Spline Sans Mono", monospace; }
.linha.aperta { align-items: center; padding: 10px 0; border-bottom: 2px solid #172238; }
.linha.aperta span { font-weight: 700; color: #172238; }
mark { font: 600 24px/1 "Spline Sans Mono", monospace; background: #F2D43D; color: #172238; padding: 6px 9px; transform: rotate(-1deg); }
.pe { display: flex; justify-content: space-between; gap: 16px; font: 500 13px/1.2 "Spline Sans Mono", monospace; color: #565E6B; white-space: nowrap; }
img { width: 560px; height: 630px; object-fit: cover; object-position: 62% 40%; display: block; }
</style>
</head>
<body>
<div class="og">
  <div class="texto">
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#172238"/><rect x="10" y="14" width="44" height="6" fill="#F5F6F2"/><rect x="23" y="20" width="6" height="34" fill="#F5F6F2"/><rect x="35" y="38" width="17" height="12" fill="#F2D43D"/></svg><span>Tulhia</span></div>
    <div>
      <h1>Quanto você deve, quando vence e em que mês o caixa aperta.</h1>
      <div class="livro">
        <div class="linha"><span>Próxima parcela, R$&nbsp;161 mil</span><b>10/03/2027</b></div>
        <div class="linha aperta"><span>O caixa aperta em</span><mark>mai/2027</mark></div>
      </div>
    </div>
    <div class="pe"><span>Caixa e dívidas da fazenda, com consultor</span><span>Dados de demonstração</span></div>
  </div>
  <img src="assets/lp-varanda-1400.webp" alt="">
</div>
</body>
</html>
